# Publish squalor-slicer to PyPI and create a GitHub Release on a version tag.
#
# Trusted publishing (OIDC). No API token lives in this repo. Before the first
# tag, add a pending publisher on PyPI for the project `squalor-slicer`:
#   owner: squalor-xyz
#   repository: slicer
#   workflow: publish.yml
#   environment: pypi
# The GitHub environment name is `pypi` as well. Cutting the tag is
# RELEASING.md. The tag must be `v` plus slicer.__version__.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: python -m unittest discover -s tests -t tests -v

      - name: slicer check
        run: PYTHONPATH=src python -m slicer check

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the packaged version
        run: |
          version=$(PYTHONPATH=src python -c "import slicer; print(slicer.__version__)")
          test "${GITHUB_REF}" = "refs/tags/v${version}"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = changelog.split("\n## ")
          matches = [s for s in sections[1:] if s.splitlines()[0].startswith(f"[{version}] - ")]
          if len(matches) != 1:
            raise SystemExit(f"Expected one dated changelog section for {version}")
          notes = matches[0].split("\n", 1)[1].strip()
          if not notes:
            raise SystemExit(f"Changelog section for {version} is empty")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
