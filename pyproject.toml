[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "squalor-slicer"
dynamic = ["version"]
description = "Roadmap and slice manager for the review -> slice -> implement loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Squalor LLC" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/squalor-xyz/slicer"
Source = "https://github.com/squalor-xyz/slicer"
Issues = "https://github.com/squalor-xyz/slicer/issues"

[project.scripts]
slicer = "slicer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slicer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slicer = ["templates/*.md", "generic-recommended-project-workflow.md"]
